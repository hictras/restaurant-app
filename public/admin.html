<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard - Restaurant Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .restaurant-select { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%234f46e5%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 9px auto; padding-right: 30px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-6 max-w-5xl mx-auto">

    <div id="customModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div id="modalIcon" class="text-3xl mb-2">🔔</div>
            <h3 id="modalTitle" class="text-lg font-bold text-gray-800 mb-1">Notification</h3>
            <p id="modalMessage" class="text-sm text-gray-600 mb-5">Message goes here...</p>
            <button onclick="closeCustomModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-indigo-700 transition">OK</button>
        </div>
    </div>

    <header class="flex justify-between items-center mb-6 bg-white p-5 rounded-2xl shadow-sm border">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">🍔 Management Console <span id="connStatus" class="w-3 h-3 rounded-full bg-red-500 inline-block" title="Disconnected"></span></h1>
        </div>
        <div class="flex items-center gap-3">
            <select id="adminRestaurantSelector" class="restaurant-select border p-2 rounded-xl text-sm font-semibold bg-gray-50 text-indigo-600 focus:outline-none" onchange="switchAdminRestaurant(this.value)" title="Select Restaurant"></select>
            <button onclick="requestNotificationPermission()" class="text-xs bg-amber-500 text-white px-3 py-2 rounded-xl font-semibold hover:bg-amber-600 transition">Enable Push 🔔</button>
            <a href="kitchen.html" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-black transition">Kitchen Display →</a>
        </div>
    </header>

    <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
        <button onclick="switchTab('tables')" id="tab-tables" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow transition">1. Tables</button>
        <button onclick="switchTab('menu')" id="tab-menu" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-700 border transition">2. Menu Management</button>
        <button onclick="switchTab('bills')" id="tab-bills" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-700 border transition">3. Bills & Payments</button>
        <button onclick="switchTab('revenue')" id="tab-revenue" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-700 border transition">4. Daily Revenue</button>
    </div>

    <div id="section-tables" class="admin-section bg-white p-6 rounded-2xl shadow-sm border mb-6">
        <h2 class="text-lg font-bold mb-4 text-gray-800">🪑 Table Status & Activation Board</h2>
        <div id="tablesGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
    </div>

    <div id="section-menu" class="admin-section bg-white p-6 rounded-2xl shadow-sm border mb-6 hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800">📋 Add / Delete Menu Items</h2>
            <span id="activeMenuRestoLabel" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg font-bold border border-indigo-100"></span>
        </div>
        <form onsubmit="addMenu(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-6 bg-gray-50 p-4 rounded-xl border">
            <input type="text" id="mName" placeholder="Item Name (EN)" required class="border p-2.5 rounded-lg text-sm bg-white">
            <input type="number" step="0.01" id="mPrice" placeholder="Price ($)" required class="border p-2.5 rounded-lg text-sm bg-white">
            <select id="mCat" class="border p-2.5 rounded-lg text-sm bg-white">
                <option value="Salads & Veggies">Salads & Veggies</option>
                <option value="Cold Mezza">Cold Mezza</option>
                <option value="Coffee, Tea & Shisha">Coffee, Tea & Shisha</option>
            </select>
            <button class="bg-indigo-600 text-white rounded-lg font-semibold text-sm hover:bg-indigo-700 transition py-2.5">Add Item</button>
        </form>
        <div id="menuList" class="space-y-3"></div>
    </div>

    <div id="section-bills" class="admin-section bg-white p-6 rounded-2xl shadow-sm border mb-6 hidden">
        <h2 class="text-lg font-bold mb-4 text-gray-800">💵 Unpaid Bills & Active Accounts</h2>
        <div id="billsList" class="space-y-3"><p class="text-gray-400 italic text-sm">No active bills.</p></div>
    </div>

    <div id="section-revenue" class="admin-section bg-white p-6 rounded-2xl shadow-sm border mb-6 hidden">
        <h2 class="text-lg font-bold mb-4 text-gray-800">📊 Total Revenue by Table & Day</h2>
        <div id="revenueContainer" class="space-y-6"><p class="text-gray-400 italic text-sm">No settled revenue data available yet.</p></div>
    </div>

    <script>
        const socket = io();
        let currentTab = 'tables';
        let globalData = { tables: {}, tableRequests: {}, orders: [] };
        let currentAdminRestaurant = '';

        const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        let previousPendingCount = 0;

        window.onload = async () => {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
            await loadAdminRestaurantsList();
        };

        async function loadAdminRestaurantsList() {
            try {
                const res = await fetch('/api/restaurants');
                const restaurants = await res.json();
                const selector = document.getElementById('adminRestaurantSelector');
                selector.innerHTML = '';

                restaurants.forEach(resto => {
                    const option = document.createElement('option');
                    option.value = resto;
                    option.textContent = resto;
                    selector.appendChild(option);
                });

                if (restaurants.length > 0) {
                    currentAdminRestaurant = restaurants[0];
                    selector.value = currentAdminRestaurant;
                    document.getElementById('activeMenuRestoLabel').innerText = `Active: ${currentAdminRestaurant}`;
                }
            } catch (e) {
                console.error('Failed to load restaurants list', e);
            }
        }

        async function switchAdminRestaurant(restaurantName) {
            currentAdminRestaurant = restaurantName;
            document.getElementById('activeMenuRestoLabel').innerText = `Active: ${restaurantName}`;
            if (currentTab === 'menu') {
                loadMenuAdmin();
            } else if (currentTab === 'revenue') {
                loadRevenueAdmin();
            }
            renderAdmin();
        }

        function requestNotificationPermission() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        showModal('Enabled!', 'Push notifications are enabled successfully.', '🎉');
                    } else {
                        showModal('Blocked', 'Notification permissions were denied.', '⚠️');
                    }
                });
            }
        }

        function triggerSystemNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: body });
            }
        }

        function showModal(title, message, icon = '🔔') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        socket.on('connect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-emerald-500 inline-block";
        });
        socket.on('disconnect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-red-500 inline-block";
        });

        socket.on('state_update', (data) => {
            globalData = data;
            const pendingCount = Object.values(data.tableRequests).filter(val => val === true).length;
            
            if (pendingCount > previousPendingCount && previousPendingCount !== 0) {
                alertSound.play().catch(e => console.log('Audio autoplay blocked.'));
                triggerSystemNotification('Table Bell Ring 🛎️', 'A table is requesting manager activation!');
            }
            previousPendingCount = pendingCount;

            renderAdmin();
        });

        socket.on('menu_updated', (data) => {
            if (data && data.restaurant === currentAdminRestaurant) {
                loadMenuAdmin();
            }
        });

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + tabName).classList.remove('hidden');
            document.querySelectorAll('[id^="tab-"]').forEach(b => b.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-700 border transition");
            document.getElementById('tab-' + tabName).className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow transition";
            
            if (tabName === 'tables') {
                document.getElementById('tab-tables').classList.remove('animate-pulse', 'bg-red-600');
            }
            if (tabName === 'menu') loadMenuAdmin();
            if (tabName === 'revenue') loadRevenueAdmin();
        }

        function renderAdmin() {
            const { tables, tableRequests, orders } = globalData;
            
            // Filter orders belonging to the selected restaurant
            const restaurantOrders = orders.filter(o => 
                !o.restaurant || o.restaurant === currentAdminRestaurant
            );

            // Determine table status specifically for this restaurant
            const activeTablesForResto = new Set(
                restaurantOrders.filter(o => o.billStatus !== 'Paid').map(o => String(o.tableNumber))
            );

            const hasPendingRequests = Object.values(tableRequests).some(val => val === true);
            const tablesTabBtn = document.getElementById('tab-tables');
            if (hasPendingRequests && currentTab !== 'tables') {
                tablesTabBtn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-red-600 text-white animate-pulse shadow-lg border-2 border-red-300";
            } else if (currentTab !== 'tables') {
                tablesTabBtn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-700 border transition";
            }

            document.getElementById('tablesGrid').innerHTML = Object.keys(tables).map(k => {
                const t = tables[k];
                const isWaiting = tableRequests[k] && !t.isOpen;
                const isOccupiedForResto = activeTablesForResto.has(String(k));

                let statusBg = 'bg-emerald-50 border-emerald-200';
                if (isOccupiedForResto) statusBg = 'bg-red-100 border-red-400 text-red-900';
                if (isWaiting) statusBg = 'bg-amber-100 border-amber-400 animate-pulse';

                return `
                    <div class="border p-4 rounded-xl text-center flex flex-col justify-between ${statusBg}">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-base">Table #${k}</span>
                                <span class="text-xs px-2 py-0.5 rounded font-bold ${isOccupiedForResto ? 'bg-red-500 text-white' : 'bg-white border'}">${isOccupiedForResto ? 'Occupied' : t.status}</span>
                            </div>
                            ${isWaiting ? '<span class="inline-block bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-bold mb-2">🛎️ Ready to Order!</span>' : ''}
                            <p class="text-xs text-gray-600 mb-3">Ordering: <b>${t.isOpen ? 'OPEN' : 'CLOSED'}</b></p>
                        </div>
                        <button onclick="socket.emit('toggle_table', {tableNum: ${k}})" class="w-full py-2 rounded-lg text-xs font-semibold text-white transition ${t.isOpen ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'}">
                            ${t.isOpen ? 'Close Ordering 🔒' : 'Open Ordering 🔓'}
                        </button>
                    </div>`;
            }).join('');

            document.getElementById('billsList').innerHTML = restaurantOrders.length === 0 ? '<p class="text-gray-400 italic text-sm">No active bills for this restaurant.</p>' : restaurantOrders.map(o => `
                <div class="flex justify-between items-center border-b pb-3 text-sm">
                    <div><b>Table #${o.tableNumber}</b> - Total: $${o.total.toFixed(2)} <span class="text-xs ml-2 px-2 py-0.5 rounded bg-gray-200">Kitchen: ${o.kitchenStatus}</span></div>
                    <div class="flex items-center gap-3">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.billStatus==='Paid'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${o.billStatus}</span>
                        <button onclick="socket.emit('update_bill_status', {orderId: '${o.orderId}', billStatus: '${o.billStatus === 'Paid' ? 'Unpaid' : 'Paid'}'})" class="bg-gray-800 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-black transition">Toggle Paid</button>
                        ${o.billStatus === 'Paid' ? `<button onclick="socket.emit('clear_bill', {orderId: '${o.orderId}'})" class="bg-rose-600 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-rose-700 transition">Clear ✓</button>` : ''}
                    </div>
                </div>`).join('');
        }

        async function loadMenuAdmin() {
            if (!currentAdminRestaurant) return;
            const res = await fetch(`/api/menu/${currentAdminRestaurant}`);
            const cats = await res.json();
            let menuHtml = '';
            cats.forEach(cat => {
                menuHtml += `<h3 class="font-bold text-indigo-600 mt-4 mb-2 text-sm uppercase tracking-wide border-b pb-1">${cat.categoryEn}</h3>`;
                cat.items.forEach(m => {
                    menuHtml += `
                        <div class="flex justify-between items-center border-b py-2 text-sm">
                            <span><b>${m.nameEn}</b> — <span class="text-indigo-600 font-bold">$${(m.price || 0).toFixed(2)}</span></span>
                            <button onclick="deleteMenu('${m.id}')" class="bg-rose-500 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-rose-600 transition">Delete</button>
                        </div>`;
                });
            });
            document.getElementById('menuList').innerHTML = menuHtml || '<p class="text-gray-400 text-xs">No items found.</p>';
        }

        async function loadRevenueAdmin() {
            const res = await fetch('/api/revenue');
            const revenueData = await res.json();
            const revContainer = document.getElementById('revenueContainer');
            
            const restoData = revenueData[currentAdminRestaurant];

            if (!restoData || Object.keys(restoData).length === 0) {
                revContainer.innerHTML = `<p class="text-gray-400 italic text-sm">No settled revenue data available for ${currentAdminRestaurant}.</p>`;
            } else {
                const dates = Object.keys(restoData);
                revContainer.innerHTML = dates.map(date => {
                    const tableRevenues = restoData[date];
                    let dailyTotal = Object.values(tableRevenues).reduce((a, b) => a + b, 0);
                    let tableRows = Object.keys(tableRevenues).map(tbl => `
                        <div class="flex justify-between border-b py-1.5 text-sm">
                            <span class="font-medium text-gray-700">Table #${tbl}</span>
                            <span class="font-bold text-emerald-600">$${tableRevenues[tbl].toFixed(2)}</span>
                        </div>
                    `).join('');

                    return `
                        <div class="border rounded-xl p-4 bg-gray-50 mb-3">
                            <div class="flex justify-between items-center mb-3 border-b pb-2">
                                <h4 class="font-bold text-gray-800">📅 Date: ${date}</h4>
                                <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">Total: $${dailyTotal.toFixed(2)}</span>
                            </div>
                            <div class="space-y-1">${tableRows}</div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function addMenu(e) {
            e.preventDefault();
            if (!currentAdminRestaurant) return;
            await fetch(`/api/menu/${currentAdminRestaurant}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nameEn: document.getElementById('mName').value,
                    price: document.getElementById('mPrice').value,
                    category: document.getElementById('mCat').value
                })
            });
            document.getElementById('mName').value = '';
            document.getElementById('mPrice').value = '';
            loadMenuAdmin();
        }

        async function deleteMenu(id) {
            if (!currentAdminRestaurant) return;
            await fetch(`/api/menu/${currentAdminRestaurant}/${id}`, { method: 'DELETE' });
            loadMenuAdmin();
        }
    </script>
</body>
</html>
