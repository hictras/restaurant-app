<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Table...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-4">
        <div class="text-4xl animate-bounce">🔄</div>
        <h2 class="text-lg font-bold text-amber-400">Securely Connecting...</h2>
        <p class="text-xs text-gray-400">Verifying your table session.</p>
    </div>

    <script>
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                document.body.innerHTML = `
                    <div class="bg-gray-800 border border-red-500/50 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-3">
                        <div class="text-4xl">⚠️</div>
                        <h2 class="text-lg font-bold text-red-400">Error Page</h2>
                        <p class="text-xs text-gray-300">Invalid or missing session token. Please scan the official QR code located on your table.</p>
                    </div>`;
                return;
            }

            try {
                const res = await fetch(`/api/verify-token?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (data.success) {
                    window.location.replace(`/menu.html?token=${token}`);
                } else {
                    throw new Error();
                }
            } catch (e) {
                document.body.innerHTML = `
                    <div class="bg-gray-800 border border-red-500/50 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-3">
                        <div class="text-4xl">⚠️</div>
                        <h2 class="text-lg font-bold text-red-400">Error Page</h2>
                        <p class="text-xs text-gray-300">Your session token is invalid or has expired.</p>
                    </div>`;
            }
        };
    </script>
</body>
</html>
