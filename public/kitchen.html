<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display - Restaurant Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .restaurant-select { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 9px auto; padding-right: 30px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">

    <header class="flex justify-between items-center mb-6 bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-amber-400 flex items-center gap-2">👨‍🍳 Kitchen Display Console <span id="connStatus" class="w-3 h-3 rounded-full bg-red-500 inline-block" title="Disconnected"></span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Restaurant:</span>
                <select id="kitchenRestaurantSelector" class="restaurant-select bg-transparent text-amber-400 font-bold text-sm focus:outline-none cursor-pointer" onchange="switchKitchenRestaurant(this.value)" title="Select Restaurant"></select>
            </div>
            <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">← Back to Admin</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <section class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 shadow-md flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h2 class="font-bold text-amber-400 flex items-center gap-2">📥 Received</h2>
                <span id="badge-Received" class="bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full text-xs font-bold">0</span>
            </div>
            <div id="col-Received" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </section>

        <section class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 shadow-md flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h2 class="font-bold text-blue-400 flex items-center gap-2">🔥 Preparing</h2>
                <span id="badge-Preparing" class="bg-blue-500/20 text-blue-300 px-2.5 py-0.5 rounded-full text-xs font-bold">0</span>
            </div>
            <div id="col-Preparing" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </section>

        <section class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 shadow-md flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h2 class="font-bold text-emerald-400 flex items-center gap-2">✅ Ready / Served</h2>
                <span id="badge-Ready" class="bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full text-xs font-bold">0</span>
            </div>
            <div id="col-Ready" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </section>

    </main>

    <script>
        const socket = io();
        let globalOrders = [];
        let currentKitchenRestaurant = '';
        const kitchenAlertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        let previousOrdersCount = 0;

        window.onload = async () => {
            await loadKitchenRestaurantsList();
        };

        async function loadKitchenRestaurantsList() {
            try {
                const res = await fetch('/api/restaurants');
                const restaurants = await res.json();
                const selector = document.getElementById('kitchenRestaurantSelector');
                selector.innerHTML = '';

                restaurants.forEach(resto => {
                    const option = document.createElement('option');
                    option.value = resto;
                    option.textContent = resto;
                    selector.appendChild(option);
                });

                if (restaurants.length > 0) {
                    currentKitchenRestaurant = restaurants[0];
                    selector.value = currentKitchenRestaurant;
                    renderKitchenBoard();
                }
            } catch (e) {
                console.error('Failed to load restaurants list', e);
            }
        }

        function switchKitchenRestaurant(restaurantName) {
            currentKitchenRestaurant = restaurantName;
            renderKitchenBoard();
        }

        socket.on('connect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-emerald-500 inline-block";
        });
        socket.on('disconnect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-red-500 inline-block";
        });

        socket.on('state_update', (data) => {
            globalOrders = data.orders || [];
            if (globalOrders.length > previousOrdersCount && previousOrdersCount !== 0) {
                kitchenAlertSound.play().catch(e => console.log('Audio autoplay blocked.'));
            }
            previousOrdersCount = globalOrders.length;
            renderKitchenBoard();
        });

        function renderKitchenBoard() {
            const receivedCol = document.getElementById('col-Received');
            const preparingCol = document.getElementById('col-Preparing');
            const readyCol = document.getElementById('col-Ready');

            receivedCol.innerHTML = '';
            preparingCol.innerHTML = '';
            readyCol.innerHTML = '';

            let counts = { Received: 0, Preparing: 0, Ready: 0 };

            const filteredOrders = globalOrders.filter(o => 
                o.kitchenStatus !== 'Paid' && 
                (!o.restaurant || o.restaurant === currentKitchenRestaurant)
            );

            filteredOrders.forEach(ord => {
                const status = ord.kitchenStatus || 'Received';
                if (status === 'Received') counts.Received++;
                else if (status === 'Preparing') counts.Preparing++;
                else counts.Ready++;

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-700 rounded-xl p-4 shadow flex flex-col justify-between gap-3 text-sm";
                
                let itemsHtml = ord.items.map((i, iIdx) => {
                    const check1 = i.checks && i.checks[0] ? 'checked' : '';
                    const check2 = i.checks && i.checks[1] ? 'checked' : '';
                    return `
                        <div class="flex items-center justify-between py-1 border-b border-slate-800 last:border-0 text-xs">
                            <span class="font-medium text-slate-200"><b>${i.qty}x</b> ${i.name}</span>
                            <div class="flex gap-2">
                                <input type="checkbox" ${check1} onclick="socket.emit('toggle_item_check', {orderId: '${ord.orderId}', itemIndex: ${iIdx}, checkIndex: 0})" class="w-4 h-4 accent-amber-500 cursor-pointer">
                                <input type="checkbox" ${check2} onclick="socket.emit('toggle_item_check', {orderId: '${ord.orderId}', itemIndex: ${iIdx}, checkIndex: 1})" class="w-4 h-4 accent-emerald-500 cursor-pointer">
                            </div>
                        </div>`;
                }).join('');

                let actionButton = '';
                if (status === 'Received') {
                    actionButton = `<button onclick="socket.emit('update_kitchen_status', {orderId: '${ord.orderId}', kitchenStatus: 'Preparing'})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-lg text-xs transition">Start Preparing 🔥</button>`;
                } else if (status === 'Preparing') {
                    actionButton = `<button onclick="socket.emit('update_kitchen_status', {orderId: '${ord.orderId}', kitchenStatus: 'Sent to Table'})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded-lg text-xs transition">Mark Ready & Send ✅</button>`;
                } else {
                    actionButton = `<span class="text-xs text-emerald-400 font-bold text-center block py-1">Served to Table 🍽️</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-amber-400 text-base">Table #${ord.tableNumber}</span>
                            <span class="text-[11px] text-slate-400">${ord.timestamp || ''}</span>
                        </div>
                        <div class="bg-slate-800/60 rounded-lg p-2.5 mb-2">${itemsHtml}</div>
                    </div>
                    <div>${actionButton}</div>
                `;

                if (status === 'Received') receivedCol.appendChild(card);
                else if (status === 'Preparing') preparingCol.appendChild(card);
                else readyCol.appendChild(card);
            });

            document.getElementById('badge-Received').innerText = counts.Received;
            document.getElementById('badge-Preparing').innerText = counts.Preparing;
            document.getElementById('badge-Ready').innerText = counts.Ready;
        }
    </script>
</body>
</html>
