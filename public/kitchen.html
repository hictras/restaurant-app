<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kitchen Display System - Restaurant Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .restaurant-select { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 9px auto; padding-right: 30px; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4 max-w-6xl mx-auto">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">🍳 Kitchen Display System <span id="connStatus" class="w-3 h-3 rounded-full bg-red-500 inline-block" title="Disconnected"></span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-xl border border-gray-700">
                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Restaurant:</span>
                <select id="kitchenRestaurantSelector" class="restaurant-select bg-transparent text-amber-400 font-bold text-sm focus:outline-none cursor-pointer" onchange="switchKitchenRestaurant(this.value)" title="Select Restaurant"></select>
            </div>
            <button onclick="requestNotificationPermission()" class="text-xs bg-amber-500 text-white px-3 py-2 rounded-xl font-semibold hover:bg-amber-600 transition">Enable Push 🔔</button>
            <a href="admin.html" class="text-xs bg-indigo-600 px-3 py-2 rounded-xl font-semibold hover:bg-indigo-700 transition">Admin Panel 🍔</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-400 italic">Waiting for active orders...</p>
        </div>
    </main>

    <script>
        const socket = io();
        let currentOrders = [];
        let currentKitchenRestaurant = '';
        const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        let previousOrderCount = 0;

        window.onload = async () => {
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
            await loadKitchenRestaurantsList();
        };

        async function loadKitchenRestaurantsList() {
            try {
                const res = await fetch('/api/restaurants');
                const restaurants = await res.json();
                const selector = document.getElementById('kitchenRestaurantSelector');
                selector.innerHTML = '';

                restaurants.forEach(resto => {
                    const option = document.createElement('option');
                    option.value = resto;
                    option.textContent = resto;
                    selector.appendChild(option);
                });

                if (restaurants.length > 0) {
                    currentKitchenRestaurant = restaurants[0];
                    selector.value = currentKitchenRestaurant;
                    renderKitchenOrders();
                }
            } catch (e) {
                console.error('Failed to load restaurants list', e);
            }
        }

        function switchKitchenRestaurant(restaurantName) {
            currentKitchenRestaurant = restaurantName;
            renderKitchenOrders();
        }

        function requestNotificationPermission() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    alert(permission === 'granted' ? 'Push notifications enabled!' : 'Notifications denied.');
                });
            }
        }

        function triggerSystemNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: body });
            }
        }

        socket.on('connect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-emerald-500 inline-block";
        });
        socket.on('disconnect', () => {
            document.getElementById('connStatus').className = "w-3 h-3 rounded-full bg-red-500 inline-block";
        });

        socket.on('state_update', (data) => {
            const activeKitchenOrders = (data.orders || []).filter(o => o.kitchenStatus !== 'Sent to Table');
            
            if (activeKitchenOrders.length > previousOrderCount && previousOrderCount !== 0) {
                alertSound.play().catch(e => console.log('Audio autoplay blocked.'));
                triggerSystemNotification('New Order Received! 🍳', 'A new table order has arrived in the kitchen.');
            }
            previousOrderCount = activeKitchenOrders.length;
            
            currentOrders = activeKitchenOrders;
            renderKitchenOrders();
        });

        function renderKitchenOrders() {
            const container = document.getElementById('ordersContainer');
            
            // Filter orders belonging to the selected restaurant
            const filteredOrders = currentOrders.filter(o => 
                !o.restaurant || o.restaurant === currentKitchenRestaurant
            );

            if (filteredOrders.length === 0) {
                container.innerHTML = `<p class="text-gray-400 italic col-span-3 text-center py-10">No active kitchen orders for ${currentKitchenRestaurant || 'this restaurant'}.</p>`;
                return;
            }

            container.innerHTML = filteredOrders.map(o => `
                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between mb-3 border-b border-gray-700 pb-2 items-center">
                            <span class="text-xl font-bold text-amber-400">Table #${o.tableNumber}</span>
                            <span class="text-xs px-2.5 py-1 rounded font-semibold bg-blue-500/20 text-blue-300">${o.kitchenStatus}</span>
                        </div>
                        
                        <div class="flex justify-between items-center text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 border-b border-gray-700/50 pb-1">
                            <span>Item Details</span>
                            <span class="text-orange-400">Cooking Finished</span>
                        </div>

                        <ul class="space-y-2 mb-4 text-sm">
                            ${o.items.map((item, itemIdx) => {
                                if(!item.checks) item.checks = [false, false];
                                return `
                                    <li class="flex justify-between items-center bg-gray-700/40 p-2.5 rounded-lg">
                                        <span class="font-medium">${item.qty}x${item.name}</span>
                                        <div class="flex items-center gap-4">
                                            <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer">
                                                <input type="checkbox" ${item.checks[0] ? 'checked' : ''} onchange="socket.emit('toggle_item_check', {orderId: '${o.orderId}', itemIndex:${itemIdx}, checkIndex: 0})" class="w-4 h-4 accent-orange-500 rounded">
                                                <span>1</span>
                                            </label>
                                            <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer">
                                                <input type="checkbox" ${item.checks[1] ? 'checked' : ''} onchange="socket.emit('toggle_item_check', {orderId: '${o.orderId}', itemIndex:${itemIdx}, checkIndex: 1})" class="w-4 h-4 accent-orange-500 rounded">
                                                <span>2</span>
                                            </label>
                                        </div>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>
                    <div class="space-y-2 pt-3 border-t border-gray-700">
                        <div class="grid grid-cols-3 gap-1 text-xs font-semibold">
                            <button onclick="socket.emit('update_kitchen_status', {orderId: '${o.orderId}', kitchenStatus: 'Received'})" class="py-2 rounded transition ${o.kitchenStatus==='Received'?'bg-blue-600':'bg-gray-700 hover:bg-gray-600'}">Recv</button>
                            <button onclick="socket.emit('update_kitchen_status', {orderId: '${o.orderId}', kitchenStatus: 'Cooking'})" class="py-2 rounded transition ${o.kitchenStatus==='Cooking'?'bg-amber-600':'bg-gray-700 hover:bg-gray-600'}">Cook</button>
                            <button onclick="socket.emit('update_kitchen_status', {orderId: '${o.orderId}', kitchenStatus: 'Ready'})" class="py-2 rounded transition ${o.kitchenStatus==='Ready'?'bg-emerald-600':'bg-gray-700 hover:bg-gray-600'}">Ready</button>
                        </div>
                        <button onclick="socket.emit('update_kitchen_status', {orderId: '${o.orderId}', kitchenStatus: 'Sent to Table'})" class="w-full bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl text-xs font-semibold transition shadow">Sent to Table ➔</button>
                    </div>
                </div>`).join('');
        }
    </script>
</body>
</html>
